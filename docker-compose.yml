# ── Docker Compose – QuickFix Full-Stack ────────────────────
# Experiment 10: Orchestrate MongoDB + Backend + Frontend
# Usage:  docker-compose up --build
# ────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── MongoDB Database ─────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: quickfix-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - quickfix-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Express Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickfix-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/quickfix
      - JWT_SECRET=${JWT_SECRET:-my_super_secret_key_123}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quickfix-network

  # ── React Frontend (Nginx) ──────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: quickfix-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - quickfix-network

# ── Shared Network ────────────────────────────────────────
networks:
  quickfix-network:
    driver: bridge

# ── Persistent Volume for MongoDB ─────────────────────────
volumes:
  mongo-data:
    driver: local
